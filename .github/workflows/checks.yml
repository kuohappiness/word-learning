# 每次 push 和 PR 都檢查：有沒有金鑰被 commit、程式測試有沒有過。
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: 檢查金鑰
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 本 repo 的金鑰檢查
        run: scripts/check-secrets.sh
      - name: gitleaks（掃描全部 commit 歷史）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: 程式測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
